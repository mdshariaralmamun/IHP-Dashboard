[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihp-backend"
version = "0.1.0"
description = "KAUST IHP Project Delivery Platform - backend (Phase 0 + Stage 1: Intake & MOM)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyJWT>=2.8,<3",
    "pwdlib[bcrypt]>=0.2,<1",
    "python-multipart>=0.0.9,<1",
    "docxtpl>=0.19,<1",
    "python-docx>=1.1,<2",
    "pypdf>=4,<7",
    "extract-msg>=0.50,<1",
    "psycopg[binary]>=3.1,<4",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    # Renders a PDF floor-plan page to PNG for the plan-marker canvas.
    "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
